  <rect x="5" y="5" width="54" height="54" fill="none" stroke="#fbf6ee" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="32" y="44.5" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', 'STSong', serif" font-size="36" font-weight="700" fill="#fbf6ee">论</text>
</svg>
